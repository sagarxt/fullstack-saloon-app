<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{subject}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @media only screen and (max-width: 600px) {
            .email-outer-table { padding: 14px 6px !important; }
            .email-main-card { border-radius: 12px !important; width: 100% !important; }
            .email-content-body { padding: 22px 14px !important; }
            .email-footer-cell { padding: 20px 14px !important; }
            .email-brand-header { padding: 18px 12px !important; }
        }
    </style>
</head>
<body style="margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color:#FAF6ED; color:#373A43;">

<table width="100%" cellpadding="0" cellspacing="0" class="email-outer-table" style="background-color:#FAF6ED; padding:24px 10px;">
    <tr>
        <td align="center">
            <table width="100%" cellpadding="0" cellspacing="0" class="email-main-card" style="max-width:600px; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 8px 30px rgba(55,58,67,0.08); border:1px solid rgba(55,58,67,0.08);">

                <!-- BRAND HEADER -->
                <tr>
                    <td class="email-brand-header" style="background: #111317; padding:22px 18px; text-align:center;">
                        <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td align="center">
                                    <a href="https://groomishnow.com" target="_blank" style="text-decoration:none; display:inline-block;">
                                        <img src="{{logoUrl}}" alt="Groomish Now" style="max-height:52px; max-width:220px; height:auto; width:auto; display:block; margin:0 auto; border:0; outline:none;" />
                                    </a>
                                    <div style="font-size:11px; font-weight:600; color:#FED652; text-transform:uppercase; letter-spacing:2px; margin-top:8px;">
                                        Premium Salon Experience & Loyalty Club
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- TOP ACCENT STRIP -->
                <tr>
                    <td height="4" style="background: linear-gradient(90deg, #FC6957 0%, #FED652 50%, #FA7B47 100%); font-size:0; line-height:0;">&nbsp;</td>
                </tr>

                <!-- CONTENT BODY -->
                <tr>
                    <td class="email-content-body" style="padding:28px 22px; font-size:14px; line-height:1.6; color:#373A43;">
                        {{content}}
                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td class="email-footer-cell" style="background-color:#FAF6ED; padding:22px 20px; text-align:center; border-top:1px solid rgba(55,58,67,0.08); font-size:12px; color:#7A7E89; line-height:1.6;">
                        <p style="margin:0 0 8px 0; font-weight:700; color:#373A43; font-size:13px;">
                            Groomish Now Salon & Spa
                        </p>
                        <p style="margin:0 0 8px 0;">
                            Certified Stylists • Premium Organic Formulations • VIP Loyalty Rewards
                        </p>
                        <p style="margin:0; font-size:11px; color:#A0A4AE;">
                            © {{year}} Groomish Now. All rights reserved.<br>
                            This is an automated notification. For support, please reach out at support@groomishnow.com
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
